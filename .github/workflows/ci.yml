name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # The floor declared in go.mod (ADR-0011). CI also builds against `stable`
  # so forward-compatibility breakage surfaces here rather than in a bug report.
  GO_FLOOR: "1.24"

jobs:
  build:
    name: Build (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build server binary
        run: make build

      - name: Build e2e runner
        run: make build-e2e

      - name: Verify the binary runs
        run: ./bin/atlascache --version

  test:
    name: Test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Unit tests with race detection (both modules)
        run: make test

      # `go mod tidy -diff` answers "is it tidy?" directly, without depending on
      # git state the way a `make deps` + `git diff` pair would.
      - name: Verify go.mod and go.sum are tidy
        run: make tidy-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_FLOOR }}
          cache: true

      # Installed directly rather than via golangci-lint-action so CI runs the
      # exact same binary and config as `make lint` locally.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint both modules
        run: make lint

  e2e:
    name: E2E gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_FLOOR }}
          cache: true

      # The regression gate. A previously-green run that fails here means a
      # regression was just introduced -- see ADR-0003.
      - name: Run the full E2E tier
        run: make e2e-full

  commit-lint:
    name: Commit convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title against Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title does not follow Conventional Commits (ADR-0008)."
            echo "Expected: <type>(<scope>): <subject>"
            echo "Example:  feat(ttl): add hierarchical time wheel"
            echo "Got:      $PR_TITLE"
            exit 1
          fi
