# AtlasCache Configuration
# Copy this file to config.yaml and modify as needed

# Node configuration
node:
  # Unique node identifier (auto-generated if empty)
  id: ""
  # Human-readable node name
  name: ""
  # Data directory for persistence (Phase 4)
  data_dir: "/var/lib/atlascache"

# Client-facing server configuration
server:
  # Interface to bind the RESP client listener to ("0.0.0.0" = all interfaces)
  bind_addr: "0.0.0.0"
  # RESP client port
  client_port: 6379

  # Connection management (FEAT-0024). Each of these bounds what one client can
  # cost, and with auth off by default every one of them is reachable by anyone
  # who can open a socket.

  # Maximum clients served at once. One more than this is accepted, told
  # "-ERR max number of clients reached", and closed -- rather than refused at
  # accept, which reaches the client as an opaque connection-refused. Each
  # connection costs a goroutine plus its read and write buffers, roughly 40KB,
  # so this default is about 400MB of connection overhead at the ceiling.
  max_connections: 10000

  # Close a connection that has issued no command for this long. Refreshed per
  # command, not per byte: a client dribbling bytes without ever completing a
  # request is still reaped. "0" disables it.
  client_idle_timeout: "30s"

  # Wire bytes one request may consume. Every per-field protocol limit bounds
  # one field and nothing bounds their product, so the largest request the
  # field limits accept is a million one-byte elements -- 7MB sent, 154MB
  # decoded (ISSUE-0018). "0" derives this from storage.max_value_size plus 1MB
  # of framing, so the largest value the engine accepts always fits.
  max_request_size: "0"

  # Pipelined commands executed before the accumulated replies are flushed.
  # Pipelining is buffering, not concurrency: N commands cost one read and one
  # write syscall instead of N of each, and this bounds how much reply a client
  # can build up by pipelining without reading.
  max_pipeline_commands: 1024

  # Reply bytes buffered for one connection before it is closed. `KEYS *` on a
  # large keyspace from a client that stops reading is the case this exists
  # for. "0" leaves output uncapped, which is not recommended.
  max_output_buffer: "64MB"

# Admin HTTP API configuration
#
# GET /health, /health/live and /health/ready need no credential, because a
# Kubernetes probe cannot present one; they report liveness and readiness and
# nothing else. GET /stats, /stats/memory and /config require admin.token.
admin:
  # Bound to loopback by default; the admin API is more powerful than the
  # data port, so it is not remotely reachable unless changed deliberately
  bind_addr: "127.0.0.1"
  # Admin HTTP port (must differ from server.client_port)
  port: 8080
  # The admin credential, and deliberately not auth.token: a client holding a
  # data token must not thereby gain administrative access, and the two must be
  # rotatable separately. Setting both to the same value is refused.
  #
  # Empty is allowed only while bind_addr is loopback. Binding a non-loopback
  # address without a token is refused at startup, since that combination
  # serves statistics and the effective configuration to anyone who can reach
  # the port. In Docker and Kubernetes, where loopback inside a container is
  # not reachable from a probe on another interface, set both: a bind_addr the
  # probe can reach, and a token.
  token: ""

# Storage engine configuration
storage:
  # Number of shards (0 = auto-detect based on CPU cores)
  # Auto-detection uses: CPU cores × 4
  shard_count: 0
  # Maximum memory limit (e.g., "1GB", "512MB", "0" = unlimited)
  max_memory: "0"
  # Maximum value size (e.g., "1MB", "512KB")
  max_value_size: "1MB"

# TTL (Time-To-Live) configuration
ttl:
  # Interval for time wheel tick (default: 100ms)
  check_interval: "100ms"
  # Enable lazy expiration (reclaim an expired key when it is read)
  lazy_expiration: true
  # Enable active expiration (background cleanup driven by the time wheel)
  active_expiration: true
  # Maximum keys expired per tick; leftovers are carried to the next tick, so
  # a mass expiry cannot stall the wheel
  batch_size: 10000

# Eviction policy configuration
eviction:
  # Policy type: lru, lfu, fifo, none
  policy: "lru"
  # Number of keys to sample for eviction victim selection
  sample_size: 5

# TLS configuration
#
# Disabled by default so the first run needs no setup. The server says so at
# startup, once per boot, naming what it costs -- do not run this way in
# production. Enabling it takes a certificate and its key, nothing else: the
# protocol floor is TLS 1.3 and is deliberately not configurable, because an
# adjustable floor is one somebody lowers.
#
# `make dev-certs` writes a self-signed localhost pair into certs/ for local
# use. Certificate and key are re-read when the files change, so a renewal
# needs no restart; a replacement that does not parse is rejected and the
# running certificate keeps serving.
tls:
  enabled: false
  # PEM certificate chain, leaf first
  cert_file: ""
  # PEM private key for cert_file
  key_file: ""

# Authentication configuration
#
# Disabled by default, with the same warning at startup: any client that can
# reach the port has full access. One shared token, checked in constant time;
# clients send either `AUTH <token>` or `AUTH default <token>`. The token is
# re-read when the config file changes, and a rotation leaves connections that
# have already authenticated alone.
auth:
  enabled: false
  # The shared secret. Keep this file readable only by the server user: a token
  # in a world-readable config is not a token.
  token: ""

# Logging configuration
logging:
  # Log level: debug, info, warn, error
  level: "info"
  # Log format: json, console
  format: "json"
