# AtlasCache Configuration
# Copy this file to config.yaml and modify as needed

# Node configuration
node:
  # Unique node identifier (auto-generated if empty)
  id: ""
  # Human-readable node name
  name: ""
  # Data directory for persistence (Phase 4)
  data_dir: "/var/lib/atlascache"

# Client-facing server configuration
server:
  # Interface to bind the RESP client listener to ("0.0.0.0" = all interfaces)
  bind_addr: "0.0.0.0"
  # RESP client port
  client_port: 6379

# Admin HTTP API configuration
admin:
  # Bound to loopback by default; the admin API is more powerful than the
  # data port, so it is not remotely reachable unless changed deliberately
  bind_addr: "127.0.0.1"
  # Admin HTTP port (must differ from server.client_port)
  port: 8080

# Storage engine configuration
storage:
  # Number of shards (0 = auto-detect based on CPU cores)
  # Auto-detection uses: CPU cores × 4
  shard_count: 0
  # Maximum memory limit (e.g., "1GB", "512MB", "0" = unlimited)
  max_memory: "0"
  # Maximum value size (e.g., "1MB", "512KB")
  max_value_size: "1MB"

# TTL (Time-To-Live) configuration
ttl:
  # Interval for time wheel tick (default: 100ms)
  check_interval: "100ms"
  # Enable lazy expiration (reclaim an expired key when it is read)
  lazy_expiration: true
  # Enable active expiration (background cleanup driven by the time wheel)
  active_expiration: true
  # Maximum keys expired per tick; leftovers are carried to the next tick, so
  # a mass expiry cannot stall the wheel
  batch_size: 10000

# Eviction policy configuration
eviction:
  # Policy type: lru, lfu, fifo, none
  policy: "lru"
  # Number of keys to sample for eviction victim selection
  sample_size: 5

# TLS configuration
#
# Disabled by default so the first run needs no setup. The server says so at
# startup, once per boot, naming what it costs -- do not run this way in
# production. Enabling it takes a certificate and its key, nothing else: the
# protocol floor is TLS 1.3 and is deliberately not configurable, because an
# adjustable floor is one somebody lowers.
#
# `make dev-certs` writes a self-signed localhost pair into certs/ for local
# use. Certificate and key are re-read when the files change, so a renewal
# needs no restart; a replacement that does not parse is rejected and the
# running certificate keeps serving.
tls:
  enabled: false
  # PEM certificate chain, leaf first
  cert_file: ""
  # PEM private key for cert_file
  key_file: ""

# Authentication configuration
#
# Disabled by default, with the same warning at startup: any client that can
# reach the port has full access. One shared token, checked in constant time;
# clients send either `AUTH <token>` or `AUTH default <token>`. The token is
# re-read when the config file changes, and a rotation leaves connections that
# have already authenticated alone.
auth:
  enabled: false
  # The shared secret. Keep this file readable only by the server user: a token
  # in a world-readable config is not a token.
  token: ""

# Logging configuration
logging:
  # Log level: debug, info, warn, error
  level: "info"
  # Log format: json, console
  format: "json"
