version: 1
name: every-step-form
tier: full
feature: FEAT-0008
issue: ISSUE-0007
description: >
  Every step form and every assertion form, driven against the fake harness.
steps:
  - cmd: PING
    expect: PONG
  - cmd: FROB
    expect_error: "ERR unknown command"
  - cmd: STATS
    expect_field:
      expirations: ">= 1"
      keys: "== 2"
  - sleep: 20ms
  - scenario: crash_and_recover
  - restart: true
  - cmd: PING
    expect: PONG
  - kill: true
